<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08172b">
  <title>Le Royaume des 64 Cases</title>
  <script>
    // Fresh code and styles on every visit, even after a GitHub Pages update.
    window.assetVersion = Date.now().toString(36);
    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.href = `style.css?v=${window.assetVersion}`;
    document.head.appendChild(stylesheet);
  </script>
  <style>
    /* Pièces légèrement plus foncées pour mieux ressortir sur le parchemin. */
    .comic-board .piece {
      color: #130d09;
      text-shadow: 0 1px 1px #fff6, 0 0 1px #0005;
    }

    /* Contraste renforcé sur téléphone et autres écrans tactiles. */
    @media (pointer: coarse) {
      .comic-board .piece {
        color: #090604;
        text-shadow: 0 1px 1px #fff5, 0 0 1px #0008;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="introCard" class="intro-card" aria-label="Couverture du Royaume des 64 Cases">
      <div class="cover-scene">
        <img class="cover-art" src="images/couverture-royale.svg" alt="Le Royaume des 64 Cases : un jeune aventurier face aux portes du château, entre les pièces blanches et noires." fetchpriority="high">
        <button id="startBtn" type="button" class="cover-start">Commencer l’aventure</button>
        <p id="serverStatus" class="server-status hidden" aria-live="polite"></p>
      </div>
    </section>
    <section id="gameCard" class="game-card hidden" aria-live="polite">
      <div class="comic-frame chapter-one-frame">
        <img id="storyImage" class="story-image" src="images/chapitre1_echequier_vide_HD.png" alt="Bande dessinée du chapitre 1">
        <div id="sceneIcon" class="scene-icon-accessible" aria-hidden="true">♟</div>
        <div id="miniGameLabel" class="mini-game-label"></div>
        <div id="chapterActions" class="chapter-actions">
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
          <button id="nextBtn" type="button" class="chapter-next hidden">Chapitre suivant →</button>
        </div>
        <div id="chessboard" class="chessboard comic-board" role="grid" aria-label="Cases interactives transparentes de l’échiquier dessiné"></div>
      </div>
      <div class="game-controls">
        <div class="chapter-line"><span id="chapterNumber">Chapitre 1</span><strong id="chapterTitle"></strong><span id="progressText">Chapitre 1 sur 9</span></div>
        <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
        <div class="puzzle-line"><div><span class="mini-label">MINI-JEU</span><h2 id="puzzleTitle"></h2></div><div id="stepBadge" class="step-badge"></div></div>
        <p id="storyText" class="hidden-copy"></p><p id="dialogueText" class="hidden-copy"></p><p id="taskText" class="task-text"></p>
        <p id="moveHint" class="move-hint">Clique une pièce blanche, puis sa case d’arrivée.</p>
        <div class="actions"><button id="resetMoveBtn" class="secondary-btn">Annuler la sélection</button></div>
      </div>
    </section>
    <section id="endingCard" class="ending-card hidden" aria-labelledby="victoryTitle">
      <div class="victory-scene">
        <img class="victory-art" src="images/victoire-royale.svg" alt="Le château libéré au coucher du soleil, entouré de pièces d’échecs et d’un parchemin couronné." loading="lazy">
        <div class="victory-message">
          <h2 id="victoryTitle">Le royaume est libéré</h2>
          <div class="mystery-box" aria-live="polite"><span>Mot mystère</span><strong id="mysteryWord">•••••••••</strong></div>
          <p>Reporte ce mot dans Certitude.</p>
        </div>
      </div>
    </section>
  </main>
  <script>
    // Preserve execution order: the game creates its board before positioning it.
    for (const source of ['app.js', 'comic.js']) {
      const script = document.createElement('script');
      script.async = false;
      script.src = `${source}?v=${window.assetVersion}`;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
